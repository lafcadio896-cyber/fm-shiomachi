name: Daily broadcast

on:
  push:
    paths:
      - ".github/workflows/daily-broadcast.yml"
  schedule:
    # 07:05 JST (22:05 UTC on the previous day)
    - cron: "5 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "音声を生成する日付（YYYY-MM-DD、未指定なら日本時間の今日）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-broadcast
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          requested="${{ inputs.date }}"
          if [ -n "$requested" ]; then
            target_date="$requested"
          else
            target_date="$(TZ=Asia/Tokyo date +%F)"
          fi
          echo "date=$target_date" >> "$GITHUB_OUTPUT"
          echo "Target date: $target_date"

      - name: Generate today's broadcast
        run: python scripts/generate_broadcast.py

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start VOICEVOX Nemo Engine
        run: |
          docker run -d --rm \
            --name voicevox-nemo \
            -p 127.0.0.1:50021:50021 \
            voicevox/voicevox_nemo_engine:cpu-latest

          ready=false
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/speakers > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            docker logs voicevox-nemo || true
            echo "VOICEVOX Nemo Engine did not become ready."
            exit 1
          fi

      - name: Generate processed broadcast audio
        run: |
          python scripts/generate_audio.py \
            --date "${{ steps.target.outputs.date }}" \
            --voice-number 6

      - name: Commit generated record and audio
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain audio 2>/dev/null)" ]; then
            echo "No new broadcast or audio to commit."
            exit 0
          fi

          git config user.name "fm-shiomachi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/broadcasts.json canon/state.json audio
          git commit -m "本日の放送音声を追加"
          git push

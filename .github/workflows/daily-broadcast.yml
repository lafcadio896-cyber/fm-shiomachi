name: Daily broadcast

on:
  schedule:
    # 07:05 JST (22:05 UTC on the previous day)
    - cron: "5 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-broadcast
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's broadcast
        run: python scripts/generate_broadcast.py

      - name: Commit generated record
        run: |
          if git diff --quiet; then
            echo "No new broadcast to commit."
            exit 0
          fi

          git config user.name "fm-shiomachi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/broadcasts.json canon/state.json
          git commit -m "本日の放送記録を追加"
          git push
